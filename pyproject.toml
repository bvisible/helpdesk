[project]
name = "helpdesk"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
description = "Open Source Customer Service Software"
#//// Neoffice — lowered from upstream's ">=3.14". That pin makes `pip install`
#//// refuse the app on the whole fleet, which runs Python 3.12 — and frappe
#//// itself requires <3.14, so upstream's own floor cannot be satisfied on a
#//// v15 bench. Drop this line the day the fleet moves to 3.14.
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Core dependencies
    "textblob==0.18.0.post0",
]
[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<=17.0.0-dev"
